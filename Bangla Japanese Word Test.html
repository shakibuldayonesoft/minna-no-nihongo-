<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangla–Japanese Word Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6b7488;--accent:#4f6df5;--accent-t:#fff;--line:#e2e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1c2030;--text:#eef0f7;--muted:#9aa3ba;--accent:#6f88ff;--accent-t:#fff;--line:#2c3248}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1c2030;--text:#eef0f7;--muted:#9aa3ba;--accent:#6f88ff;--accent-t:#fff;--line:#2c3248}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali","Noto Sans JP",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:100%;max-width:520px;text-align:center}
h1{font-size:18px;font-weight:600;color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;min-height:200px}
.word-wrap{width:100%;min-width:0}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-bottom:12px}
.word{font-size:clamp(32px,9vw,52px);font-weight:600;word-break:break-word;line-height:1.3}
.word.long{font-size:clamp(22px,6vw,32px)}
.meaning{margin-top:16px;font-size:clamp(22px,6vw,32px);color:var(--accent);min-height:1.4em;word-break:break-word}
.examples{margin-top:16px;text-align:left;display:flex;flex-direction:column;gap:10px}
.ex{border-top:1px solid var(--line);padding-top:10px}
.ex-ja{font-size:18px;font-family:"Noto Sans JP",sans-serif}
.ex-bn{font-size:16px;color:var(--muted);margin-top:2px}
.hidden{display:none!important}
.menu{display:flex;flex-direction:column;gap:12px}
.menu .next{margin-top:0;padding:18px}
.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.back{margin-top:12px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit}
.details{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.details>.inner{overflow:hidden;min-height:0}
.details.open{grid-template-rows:1fr}
.arrow svg{transition:transform .3s ease}
.arrow.open svg{transform:rotate(180deg)}
.arrow{flex:none;display:flex;align-items:center;justify-content:center;padding:0;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-t);font-size:26px;cursor:pointer}
.arrow:active,.next:active{transform:scale(.95)}
.next{margin-top:16px;width:100%;padding:14px;font-size:18px;font-weight:600;border:none;border-radius:14px;background:var(--accent);color:var(--accent-t);cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <h1 id="title">Word Test</h1>

  <div id="menu" class="menu">
    <button class="next" id="btnAll">All (সব word, random)</button>
    <button class="next alt" id="btnLesson">Lesson by lesson</button>
  </div>

  <div id="lessons" class="hidden">
    <div class="menu" id="lessonList"></div>
    <button class="back" id="backMenu">&larr; Back</button>
  </div>

  <div id="test" class="hidden">
    <div class="card">
      <div class="word-wrap">
        <span class="tag" id="tag"></span>
        <div class="word" id="word"></div>
        <div class="details" id="details"><div class="inner">
          <div class="meaning" id="meaning"></div>
          <div class="examples" id="examples"></div>
        </div></div>
      </div>
      <button class="arrow" id="arrow" aria-label="Show meaning" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    </div>
    <button class="next" id="next">Next</button>
    <button class="back" id="backTest">&larr; Back</button>
  </div>
</div>
<script>

const $ = id => document.getElementById(id);
const wordEl = $("word"), meaningEl = $("meaning"), examplesEl = $("examples"), tagEl = $("tag");
let pool = [], mode = "all", current = null;

function show(view) {
  ["menu", "lessons", "test"].forEach(v => $(v).classList.toggle("hidden", v !== view));
}

function showRandom() {
  let w;
  do { w = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && w === current);
  current = w;
  // random: kokhono word (w.lang), kokhono tar meaning samne ashbe
  const flip = Math.random() < 0.5;
  const frontLang = flip ? (w.lang === "bn" ? "ja" : "bn") : w.lang;
  const front = flip ? w.meaning : w.word;
  const back = flip ? w.word : w.meaning;
  wordEl.textContent = front;
  wordEl.lang = frontLang;
  wordEl.classList.toggle("long", front.length > 18);
  meaningEl.textContent = back;
  meaningEl.lang = frontLang === "bn" ? "ja" : "bn";
  tagEl.textContent = (frontLang === "bn" ? "বাংলা" : "日本語") + (mode === "lesson" ? " · Lesson " + w.lesson : "");
  examplesEl.innerHTML = "";
  (w.examples || []).slice(0, 2).forEach(e => {
    const d = document.createElement("div");
    d.className = "ex";
    const a = document.createElement("div"); a.className = "ex-ja"; a.textContent = e.ja;
    const b = document.createElement("div"); b.className = "ex-bn"; b.textContent = e.bn;
    d.append(a, b);
    examplesEl.appendChild(d);
  });
  $("details").classList.remove("open");
  $("arrow").classList.remove("open");
  $("arrow").setAttribute("aria-expanded", "false");
}

function startTest(list) {
  pool = list;
  current = null;
  show("test");
  showRandom();
}

$("btnAll").addEventListener("click", () => { mode = "all"; startTest(words); });

$("btnLesson").addEventListener("click", () => {
  const box = $("lessonList");
  box.innerHTML = "";
  const ids = [...new Set(words.map(w => w.lesson))].sort((a, b) => a - b);
  ids.forEach(id => {
    const list = words.filter(w => w.lesson === id);
    const btn = document.createElement("button");
    btn.className = "next alt";
    btn.textContent = "Lesson " + id + " (" + list.length + " words)";
    btn.addEventListener("click", () => { mode = "lesson"; startTest(list); });
    box.appendChild(btn);
  });
  show("lessons");
});

$("backMenu").addEventListener("click", () => show("menu"));
$("backTest").addEventListener("click", () => {
  if (mode === "lesson") $("btnLesson").click(); else show("menu");
});

$("arrow").addEventListener("click", () => {
  const open = !$("details").classList.contains("open");
  $("details").classList.toggle("open", open);
  $("arrow").classList.toggle("open", open);
  $("arrow").setAttribute("aria-expanded", open);
});
$("next").addEventListener("click", showRandom);
